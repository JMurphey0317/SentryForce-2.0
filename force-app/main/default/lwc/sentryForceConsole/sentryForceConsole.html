<template>
    <lightning-card title="SentryForce 2.0 Monitoring Console" icon-name="utility:warning">
        <div class="slds-p-around_medium">
            <lightning-button variant="brand" label="Run ELF Retrieval" onclick={runElfRetrieval}></lightning-button>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <h3 class="slds-text-heading_small">Recent Alerts</h3>
            <template if:true={alerts.length}>
                <template for:each={alerts} for:item="alert">
                    <p key={alert.Id}><strong>{alert.Severity__c}</strong> - {alert.Message__c}</p>
                </template>
            </template>
            <template if:false={alerts.length}>
                <p>No alerts yet.</p>
            </template>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <h3 class="slds-text-heading_small">Recent Events</h3>
            <template if:true={events.length}>
                <template for:each={events} for:item="eventRecord">
                    <p key={eventRecord.Id}>{eventRecord.Event_Type__c} ({eventRecord.Event_Source__c}) - Score {eventRecord.Risk_Score__c}</p>
                </template>
            </template>
            <template if:false={events.length}>
                <p>No events yet.</p>
            </template>
        </div>
    </lightning-card>
</template>
