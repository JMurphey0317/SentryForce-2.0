<template>
    <div class="slds-grid slds-wrap slds-gutters_small slds-p-horizontal_medium slds-p-bottom_medium">
        <template for:each={metrics} for:item="metric">
            <div key={metric.label} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                <lightning-card title={metric.label}>
                    <div class="slds-p-around_medium">
                        <p class="slds-text-heading_medium">{metric.value}</p>
                        <p class="slds-text-body_small">{metric.helperText}</p>
                    </div>
                </lightning-card>
            </div>
        </template>
    </div>
</template>
